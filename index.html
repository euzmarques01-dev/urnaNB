<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Urna Eletrônica – Eleições Gerais</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9eef6;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial,sans-serif;}
.top{position:fixed;top:10px;right:10px;display:flex;gap:10px;}
.top button{padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;}
.urna{width:400px;background:#fff;border-radius:18px;padding:16px;box-shadow:0 15px 40px rgba(0,0,0,.25);position:relative;}
.screen{background:#0b1220;color:#fff;padding:14px;border-radius:12px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.label{font-size:12px;color:#cbd5e1;}
.cargo{font-size:20px;font-weight:800;margin:6px 0;}
.digits{display:flex;justify-content:center;gap:8px;margin:12px 0;}
.digit{width:46px;height:58px;background:#fff;color:#000;display:flex;justify-content:center;align-items:center;font-size:26px;font-weight:700;border-radius:6px;}
.candidate{text-align:center;font-weight:800;margin-top:6px;}
.candidate img{max-width:120px;margin-top:6px;border-radius:8px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
button{padding:14px;font-size:18px;border-radius:8px;border:none;cursor:pointer;}
.key{background:#111;color:#fff;}
.green{background:#00a74a;color:#fff;font-weight:800;}
.orange{background:#ff7f00;color:#fff;}
.white{background:#fff;color:#000;font-weight:800;border:1px solid #999;}
#comprovante{position:fixed;inset:0;background:#000;color:#0f0;display:none;justify-content:center;align-items:center;font-family:'Roboto',sans-serif;}
.comp{border:2px solid #0f0;padding:20px;width:340px;text-align:center;}
#founderPanel{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;overflow-y:auto;padding:20px;}
.fp{background:#fff;padding:20px;border-radius:16px;width:480px;max-height:90vh;overflow-y:auto;}
.fp input,.fp button,.fp select{width:100%;margin-top:6px;padding:8px;}
.fp pre{background:#eee;padding:8px;max-height:400px;overflow:auto;}
#fimDisplay{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:64px;
  color:#00ff00;
  font-weight:800;
  background:rgba(0,0,0,.8);
  z-index:99;
  animation: blink 1s steps(2) infinite;
}
@keyframes blink {50% {opacity:0;}}
</style>
</head>
<body>

<div class="top">
  <button id="btnFundador">Fundador</button>
  <button id="btnBoletim">Boletim</button>
</div>

<div class="urna">
  <div class="screen">
    <div class="label" id="label">DIGITE SEU TÍTULO</div>
    <div class="cargo" id="cargo"></div>
    <div class="digits" id="digits"></div>
    <div class="candidate" id="candidate"></div>
    <div id="fimDisplay">FIM</div>
  </div>

  <div class="grid">
    <button class="key" data-n="1">1</button>
    <button class="key" data-n="2">2</button>
    <button class="key" data-n="3">3</button>
    <button class="key" data-n="4">4</button>
    <button class="key" data-n="5">5</button>
    <button class="key" data-n="6">6</button>
    <button class="key" data-n="7">7</button>
    <button class="key" data-n="8">8</button>
    <button class="key" data-n="9">9</button>
  </div>

  <div style="display:flex;gap:6px;margin-top:6px">
    <button class="white" id="branco">BRANCO</button>
    <button class="key" data-n="0">0</button>
    <button class="orange" id="corrige">CORRIGE</button>
    <button class="green" id="confirma">CONFIRMA</button>
  </div>
</div>

<div id="comprovante">
  <div class="comp">
    <h1>COMPROVANTE DE VOTAÇÃO</h1>
    <p>Nome: <span id="cNome"></span></p>
    <p>Título: <span id="cTitulo"></span></p>
    <p>Data/Hora: <span id="cData"></span></p>
    <p id="cVotos">VOTO REGISTRADO COM SUCESSO</p>
    <p style="text-align:right; font-weight:800;">Nação Brasileira</p>
  </div>
</div>

<div id="founderPanel">
<div class="fp">
<h3>Painel do Fundador</h3>
<h4>Cadastrar Eleitor</h4>
<input id="etTitulo" placeholder="Título (8 dígitos)">
<input id="etNome" placeholder="Nome do eleitor">
<button id="addEleitorBtn">Cadastrar Eleitor</button>
<hr>

<h4>Cadastrar Candidato</h4>
<select id="cargoSelect">
  <option value="DEP_ESTADUAL">Dep. Estadual</option>
  <option value="DEP_FEDERAL">Dep. Federal</option>
  <option value="SENADOR">Senador</option>
  <option value="GOVERNADOR">Governador</option>
  <option value="PRESIDENTE">Presidente</option>
</select>
<input id="candNum" placeholder="Número do Candidato">
<input id="candNome" placeholder="Nome do Candidato">
<input id="candPartido" placeholder="Partido">
<input id="candFoto" type="file" accept="image/*">
<button id="addCandidatoBtn">Cadastrar Candidato</button>
<hr>

<label>Senha Boletim (3 dígitos)</label>
<input id="senhaBoletim" maxlength="3" placeholder="123">
<button id="salvarSenhaBtn">Salvar/Atualizar Senha</button>
<hr>

<button id="verApuracaoBtn">Ver Apuração</button>
<button id="verEleitoresBtn">Eleitores que Votaram</button>
<button id="resetBtn">RESETAR TUDO</button>
<button id="fecharFundadorBtn">Fechar</button>
<pre id="out"></pre>
</div>
</div>

<!-- Áudios: coloque seu link aqui -->
<audio id="audioConfirma" src="https://www.myinstants.com/pt/instant/confirma-urna-eletronica/?utm_source=copy&utm_medium=share"></audio>
<audio id="audioFim" src="https://www.myinstants.com/pt/instant/urna-eletronica-confirma/?utm_source=copy&utm_medium=share"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, get, set, child } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAE-c6y2Z1JsQplCfj1UNW7Wyr4ssCsJQU",
  authDomain: "tse-painel.firebaseapp.com",
  databaseURL: "https://tse-painel-default-rtdb.firebaseio.com",
  projectId: "tse-painel",
  storageBucket: "tse-painel.firebasestorage.app",
  messagingSenderId: "818733405394",
  appId: "1:818733405394:web:8e3e3e45062e3122e9490b",
  measurementId: "G-49XLVVE7D5"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let cargos = [
  {nome:"DEP_ESTADUAL", digitos:5},
  {nome:"DEP_FEDERAL", digitos:4},
  {nome:"SENADOR", digitos:3},
  {nome:"GOVERNADOR", digitos:2},
  {nome:"PRESIDENTE", digitos:2}
];
let cargoIndex = 0, cargoAtual = cargos[0].nome;
let etapa = "titulo", buf=[], titulo="", nome="";

const digitsBox=document.getElementById("digits");
const label=document.getElementById("label");
const cargoElem=document.getElementById("cargo");
const cand=document.getElementById("candidate");
const fimDisplay=document.getElementById("fimDisplay");
const founderPanel=document.getElementById("founderPanel");
const out=document.getElementById("out");

function render() {
  digitsBox.innerHTML="";
  let lim = etapa==="titulo"?8:cargos[cargoIndex].digitos;
  for(let i=0;i<lim;i++){
    let d=document.createElement("div");
    d.className="digit";
    d.textContent=buf[i]||"";
    digitsBox.appendChild(d);
  }
}

function atualizarCargo() {
  cargoAtual = cargos[cargoIndex].nome;
  cargoElem.textContent=cargoAtual.replace("_"," ");
  buf=[];
  render();
  cand.innerHTML="";
}

function mostrarComprovante(){
  fimDisplay.style.display="none";
  document.querySelector(".urna").style.display="none";
  document.getElementById("cNome").textContent=nome;
  document.getElementById("cTitulo").textContent=titulo;
  document.getElementById("cData").textContent=new Date().toLocaleString();
  document.getElementById("comprovante").style.display="flex";
}

async function registrarVoto(voto){
  try{ await document.getElementById("audioConfirma").play(); } catch(e){console.log("Erro audio confirma"); }

  const snap = await get(child(ref(db), `votos/${cargoAtual}/${voto}`));
  await set(ref(db, `votos/${cargoAtual}/${voto}`), {count:(snap.exists()?snap.val().count:0)+1});

  const ip = await fetch("https://api.ipify.org?format=json").then(r=>r.json()).then(d=>d.ip).catch(()=> "Não identificado");
  const snapVotados = await get(child(ref(db), `eleitores_votaram/${titulo}`));
  let dataVotacao = snapVotados.exists()?snapVotados.val():{};
  dataVotacao[cargoAtual]={nome:nome,data:new Date().toLocaleString(),ip:ip,voto:voto};
  await set(ref(db, `eleitores_votaram/${titulo}`), dataVotacao);

  cargoIndex++;
  if(cargoIndex >= cargos.length){ // Último cargo
    fimDisplay.style.display="flex";
    try{ await document.getElementById("audioFim").play(); } catch(e){console.log("Erro audio fim"); }
    setTimeout(()=>mostrarComprovante(),5000);
    etapa="titulo"; buf=[]; titulo=""; nome=""; cargoIndex=0;
  } else {
    atualizarCargo();
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  document.querySelectorAll(".key").forEach(b=>{
    b.addEventListener("click", async ()=>{
      let lim = etapa==="titulo"?8:cargos[cargoIndex].digitos;
      if(buf.length<lim){ 
        buf.push(b.dataset.n); 
        render();
        if(etapa==="voto" && buf.length===cargos[cargoIndex].digitos){
          const snap = await get(child(ref(db), `candidatos/${cargoAtual}/${buf.join("")}`));
          if(snap.exists()){
            const data = snap.val();
            cand.innerHTML = `${data.nome} (${data.partido})<br>`;
            if(data.foto) cand.innerHTML += `<img src="${data.foto}">`;
          } else { cand.textContent="NÚMERO INVÁLIDO"; }
        } else { cand.textContent=""; }
      }
    });
  });

  document.getElementById("confirma").addEventListener("click", async ()=>{
    if(etapa==="titulo"){
      if(buf.length!==8){alert("Título inválido"); return;}
      const snap = await get(child(ref(db), `eleitores/${buf.join("")}`));
      if(!snap.exists()){alert("Eleitor não cadastrado"); return;}
      const votouSnap = await get(child(ref(db), `eleitores_votaram/${buf.join("")}`));
      if(votouSnap.exists()){alert("Este título já votou"); return;}
      titulo = buf.join(""); nome = snap.val().nome;
      etapa="voto"; atualizarCargo();
    } else if(etapa==="voto"){
      registrarVoto(buf.join(""));
    }
  });

  document.getElementById("branco").addEventListener("click", ()=>{
    if(etapa!=="voto"){alert("Digite seu título primeiro!"); return;}
    registrarVoto("BRANCO");
  });

  document.getElementById("corrige").addEventListener("click", ()=>{
    buf=[]; render(); cand.innerHTML="";
  });

  document.getElementById("btnFundador").addEventListener("click", ()=>{
    if(prompt("Senha do fundador")!=="2007") return;
    founderPanel.style.display="flex";
  });
  document.getElementById("fecharFundadorBtn").addEventListener("click", ()=>founderPanel.style.display="none");

  document.getElementById("addEleitorBtn").addEventListener("click", async ()=>{
    const t=document.getElementById("etTitulo").value;
    const n=document.getElementById("etNome").value;
    if(t.length!==8||!n){alert("Preencha corretamente"); return;}
    await set(ref(db, `eleitores/${t}`), {nome:n});
    alert("Eleitor cadastrado!"); document.getElementById("etTitulo").value=""; document.getElementById("etNome").value="";
  });

  document.getElementById("addCandidatoBtn").addEventListener("click", async ()=>{
    const cargo = document.getElementById("cargoSelect").value;
    const num=document.getElementById("candNum").value;
    const n=document.getElementById("candNome").value;
    const p=document.getElementById("candPartido").value;
    const f=document.getElementById("candFoto").files[0];
    if(!num||!n||!p){alert("Preencha todos os campos"); return;}
    let fotoURL = f?URL.createObjectURL(f):"";
    await set(ref(db, `candidatos/${cargo}/${num}`), {nome:n,partido:p,foto:fotoURL});
    alert("Candidato cadastrado!"); 
    document.getElementById("candNum").value=""; document.getElementById("candNome").value=""; 
    document.getElementById("candPartido").value=""; document.getElementById("candFoto").value="";
  });

  document.getElementById("salvarSenhaBtn").addEventListener("click", ()=>{
    const s = document.getElementById("senhaBoletim").value;
    if(s.length!==3){ alert("Digite 3 números"); return; }
    const validade = Date.now() + 24*60*60*1000;
    localStorage.setItem("senhaBoletim", JSON.stringify({senha:s, validade:validade}));
    alert("Senha do boletim cadastrada! Válida por 24 horas.");
  });

  document.getElementById("btnBoletim").addEventListener("click", async ()=>{
    const dadosStr = localStorage.getItem("senhaBoletim");
    if(!dadosStr){ alert("Nenhuma senha de boletim cadastrada"); return; }
    const dados = JSON.parse(dadosStr);
    if(Date.now() > dados.validade){ alert("Senha expirada. Cadastre novamente."); return; }
    const s = prompt("Digite a senha do boletim (3 números)");
    if(!s || s!==dados.senha){ alert("Senha incorreta"); return; }

    let str="TSE - NAÇÃO BRASILEIRA\n\n";
    for(const c of cargos){
      const snap = await get(ref(db, `votos/${c.nome}`));
      str+=`--- ${c.nome.replace("_"," ")} ---\n`;
      if(snap.exists()){ const votos = snap.val(); for(const k in votos) str+=`${k} → ${votos[k].count}\n`; }
      else str+="Nenhum voto registrado\n";
      str+="\n";
    }
    alert(str);
  });

  document.getElementById("verApuracaoBtn").addEventListener("click", async ()=>{
    let str="APURAÇÃO DE VOTOS\n\n";
    for(const c of cargos){
      const snap = await get(ref(db, `votos/${c.nome}`));
      str+=`--- ${c.nome.replace("_"," ")} ---\n`;
      if(snap.exists()){const votos=snap.val(); for(const k in votos) str+=`${k} → ${votos[k].count}\n`;}
      else str+="Nenhum voto registrado\n";
      str+="\n";
    }
    out.textContent=str;
  });

  document.getElementById("verEleitoresBtn").addEventListener("click", async ()=>{
    const snap = await get(ref(db, "eleitores_votaram"));
    if(!snap.exists()){out.textContent="Nenhum eleitor votou ainda"; return;}
    const eleitores = snap.val();
    let str="ELEITORES QUE VOTARAM\n\n";
    for(const t in eleitores){
      str+=`${t} → ${JSON.stringify(eleitores[t])}\n`;
    }
    out.textContent=str;
  });

  document.getElementById("resetBtn").addEventListener("click", async ()=>{
    if(confirm("Resetar tudo?")){ await set(ref(db),{}); location.reload(); }
  });

});
</script>
</body>
</html>
